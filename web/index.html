<body>
<div class="wrap" id="wrap">

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { computeLayout, layoutOptions, minDoors } from "./layout.js";

const EN = new URLSearchParams(location.search).get("lang") === "en";
const T = EN ? {
  width: "Width", height: "Height", top: "Top panel", layout: "Doors", door: "Door",
  tops: { inset: "Between the sides", onset: "Covering the sides", none: "None (sink)" },
  layouts: { single: "All single doors", pair: "Double doors", left: "Single door on the left", right: "Single door on the right" },
  doorState: { closed: "Closed", open: "Open" },
  info: (L) => `<b>${L.n}</b> doors · <b>${L.nh}</b> hinges each · <b>${L.dividers.length}</b> inner walls · <b>${L.nShelves * L.bays.length}</b> shelves · <b>${L.legs.length}</b> legs`,
  note: "Depth 600 mm. No top panel: the worktop is fitted later, so only a front top rail. Doors, hinges, walls, shelves and legs follow the design rules of one parametric model.",
  updated: (d, r) => `Latest version: ${d}${r ? " (" + r + ")" : ""}`,
  credit: `<a href="https://jeongyeon.framer.website/en/project/ai-parametric-cabinet-live" target="_top">Jeongyeon Kim · AI parametric cabinet research</a>`,
  product: "Product", base: "Base cabinet", size: "Size (agent's two versions)", fronts: "Doors / drawer fronts",
  frontState: { show: "Shown", hide: "Hidden" },
  names: { f1_tall: "Tall cabinet", f2_wall: "Wall cabinet", f3_open: "Open shelf", f4_drawer: "Drawers", f5_corner: "Corner cabinet" },
  famInfo: (c) => `<b>${c.doors ?? 0}</b> doors · <b>${c.drawers ?? 0}</b> drawers · <b>${c.shelves ?? 0}</b> shelves · <b>${c.legs ?? 0}</b> legs`,
  famNote: "Built by the AI agent from the design rulebook written for base cabinets (few or no rules for this product). Checked by the rule checker.",
  customer: "Customer", notes: "What the agent decided (in Korean)",
} : {
  width: "폭", height: "높이", top: "상판", layout: "문 배치", door: "문",
  tops: { inset: "측판 사이", onset: "위를 덮음", none: "없음 (싱크대)" },
  layouts: { single: "모두 단일 도어", pair: "양문", left: "왼쪽 단일 도어", right: "오른쪽 단일 도어" },
  doorState: { closed: "닫힘", open: "열림" },
  info: (L) => `문 <b>${L.n}</b>짝 · 문마다 힌지 <b>${L.nh}</b>개 · 칸막이 <b>${L.dividers.length}</b>개 · 선반 <b>${L.nShelves * L.bays.length}</b>개 · 다릿발 <b>${L.legs.length}</b>개`,
  note: "깊이 600mm. 상판은 나중에 쿡탑·싱크 위치에 맞춰 올리므로 앞 가로대만 있습니다. 문, 힌지, 칸막이, 선반, 다릿발은 하나의 파라메트릭 모델에 정해 둔 설계 규칙에 따라 바뀝니다.",
  updated: (d, r) => `최신 버전: ${d}${r ? " (" + r + ")" : ""}`,
  credit: `<a href="https://jeongyeon.framer.website/project/ai-parametric-cabinet-live" target="_top">김정연 · AI 파라메트릭 하부장 연구</a>`,
  product: "제품", base: "하부장", size: "크기 (에이전트가 만든 두 버전)", fronts: "문·서랍 앞판",
  frontState: { show: "보임", hide: "숨김" },
  names: {},
  famInfo: (c) => `문 <b>${c.doors ?? 0}</b>짝 · 서랍 <b>${c.drawers ?? 0}</b>개 · 선반 <b>${c.shelves ?? 0}</b>개 · 다릿발 <b>${c.legs ?? 0}</b>개`,
  famNote: "하부장용으로 쓴 설계 규칙서만 보고 AI 에이전트가 만든 모델입니다(이 제품 규칙은 없거나 적음). 규칙 검사기로 확인했습니다.",
  customer: "고객", notes: "에이전트가 스스로 정한 것",
};

const state = { W: 1500, H: 850, D: 600, top: "rail", layout: "left", open: false, product: "base", turn: 2, fronts: "show" };
let version = {};
let famIndex = [];
const famCache = {};

// ---------- three.js scene ----------
const view = document.getElementById("view");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(30, 1, 0.01, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
const sun = new THREE.DirectionalLight(0xffffff, 1.4);
sun.position.set(-1.5, 3, 2.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -2, right: 2, top: 2.5, bottom: -2, near: 0.1, far: 10 });
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.ShadowMaterial({ opacity: 0.22 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// materials
function oakCanvas(size = 512) {
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(size, size);
  let seed = 7;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const ph = [rnd(), rnd()];
  const raw = Array.from({ length: size + 2 }, () => rnd() * 2 - 1);
  const streak = new Float32Array(size);
  for (let i = 0; i < size; i++) streak[i] = ((raw[i] + raw[i + 1] + raw[i + 2]) / 3) * 1.7;
  for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
    const u = x / size, v = y / size;
    const wander = 0.005 * Math.sin(2 * Math.PI * (0.9 * v + 2.3 * u + ph[0])) + 0.003 * Math.sin(2 * Math.PI * (2.1 * v - 4.1 * u + ph[1]));
    const bands = 0.5 + 0.5 * Math.sin(2 * Math.PI * (u + wander) * 11 + 1.5 * Math.sin(2 * Math.PI * u * 2));
    const s = streak[(x + Math.round(wander * size) + size) % size];
    const t = Math.min(1, Math.max(0, 0.55 + 0.18 * (bands - 0.5) + 0.07 * s));
    const i = (y * size + x) * 4;
    img.data[i] = 176 + 38 * t; img.data[i + 1] = 138 + 44 * t; img.data[i + 2] = 94 + 44 * t; img.data[i + 3] = 255;
  }
  ctx.putImageData(img, 0, 0);
  return c;
}
const oakSrc = oakCanvas();
const M = {
  body: new THREE.MeshStandardMaterial({ color: 0xece5d6, roughness: 0.6 }),
  leg: new THREE.MeshStandardMaterial({ color: 0x1e1e20, roughness: 0.4, metalness: 0.6 }),
  cup: new THREE.MeshStandardMaterial({ color: 0x9a9a9a, roughness: 0.5, metalness: 0.3 }),
  line: new THREE.LineBasicMaterial({ color: 0x2a2a2a }),
};
function oakMaterial(w, h) {
  const t = new THREE.CanvasTexture(oakSrc);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(w / 600, h / 600);
  return new THREE.MeshStandardMaterial({ map: t, roughness: 0.6 });
}

let group = null;
const S = 0.001; // mm -> m
// cabinet coords (x right, y depth with the front at y<0, z up) -> three.js (x, z, -y)
function box(parent, mat, x, y, z, dx, dy, dz) {
  const geo = new THREE.BoxGeometry(dx * S, dz * S, dy * S);
  const m = new THREE.Mesh(geo, mat);
  m.position.set((x + dx / 2) * S, (z + dz / 2) * S, -(y + dy / 2) * S);
  m.castShadow = m.receiveShadow = true;
  parent.add(m);
  const e = new THREE.LineSegments(new THREE.EdgesGeometry(geo), M.line);
  e.position.copy(m.position);
  parent.add(e);
  return m;
}

function clearGroup() {
  if (group) {
    scene.remove(group);
    group.traverse((o) => { if (o.geometry) o.geometry.dispose(); if (o.material && o.material.map) { o.material.map.dispose(); o.material.dispose(); } });
    group = null;
  }
}

// a model the agent made: meshes in cabinet mm coordinates, shown as they are
function buildFamily(item) {
  clearGroup();
  group = new THREE.Group();
  const [x0, y0, , x1, y1] = item.box;
  for (const part of item.parts) {
    if (part.m === "front" && state.fronts === "hide") continue;
    const pos = new Float32Array(part.v.length);
    for (let i = 0; i < part.v.length; i += 3) {
      pos[i] = part.v[i] * S; pos[i + 1] = part.v[i + 2] * S; pos[i + 2] = -part.v[i + 1] * S;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    geo.setIndex(part.i);
    geo.computeVertexNormals();
    let mat = M.body;
    if (part.m === "leg" || part.m === "pin") mat = M.leg;
    if (part.m === "front") {
      geo.computeBoundingBox();
      const b = geo.boundingBox;
      // planar UVs on the front face so the oak grain runs up the door
      const uv = new Float32Array((pos.length / 3) * 2);
      const wide = (b.max.x - b.min.x) >= (b.max.z - b.min.z);
      for (let i = 0, j = 0; i < pos.length; i += 3, j += 2) {
        uv[j] = (wide ? pos[i] - b.min.x : pos[i + 2] - b.min.z) / 0.6;
        uv[j + 1] = (pos[i + 1] - b.min.y) / 0.6;
      }
      geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
      mat = oakMaterial(600, 600);
    }
    const m = new THREE.Mesh(geo, mat);
    m.castShadow = m.receiveShadow = true;
    group.add(m);
    if (part.m !== "pin") group.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo, 25), M.line));
  }
  group.position.x = (-(x0 + x1) / 2) * S;
  group.position.z = ((y0 + y1) / 2) * S;
  scene.add(group);
}

function build() {
  const n = minDoors(state.W);
  const opts = layoutOptions(n);
  if (!opts.find((o) => o.key === state.layout)) state.layout = "single";
  const groups = opts.find((o) => o.key === state.layout).groups;
  // "all single doors": every door is its own bay and hinges on the left
  const L = computeLayout({ W: state.W, H: state.H, D: state.D, top_mode: state.top, door_layout: groups,
    single_door_hinge: state.layout === "single" ? "left" : null });
  const p = L.p, t = p.t;
  clearGroup();
  group = new THREE.Group();
  const bodyD = L.Dc - p.back_t;
  const sideH = L.Hc;
  box(group, M.body, 0, 0, L.z0, t, bodyD, sideH);
  box(group, M.body, p.W - t, 0, L.z0, t, bodyD, sideH);
  box(group, M.body, t, 0, L.z0, p.W - 2 * t, bodyD, t);
  // base cabinets have no top panel (the worktop goes on later): a front top rail only
  box(group, M.body, t, 0, L.z0 + L.Hc - t, p.W - 2 * t, p.rail_d, t);
  box(group, M.body, 0, L.Dc - p.back_t, L.z0, p.W, p.back_t, L.Hc);
  for (const [x0, x1] of L.dividers) box(group, M.body, x0, 0, L.innerBottom, x1 - x0, L.innerBack, L.clearH);
  for (const [x0, x1] of L.bays) for (const zb of L.shelfZ)
    box(group, M.body, x0 + p.shelf_clear, 0, zb, x1 - x0 - 2 * p.shelf_clear, L.innerBack, p.shelf_t);
  for (const [x, y] of L.legs) {
    const c = new THREE.Mesh(new THREE.CylinderGeometry(p.leg_d / 2 * S, p.leg_d / 2 * S, p.leg_h * S, 24), M.leg);
    c.position.set(x * S, p.leg_h / 2 * S, -y * S);
    c.castShadow = true;
    group.add(c);
  }
  // doors turn on their hinge edge (at the door's back face)
  for (const d of L.doors) {
    const left = d.side === "left";
    const px = left ? d.x : d.x + d.w;
    const pivot = new THREE.Group();
    pivot.position.set(px * S, 0, p.gap * S);
    const inner = new THREE.Group();
    inner.position.set(-px * S, 0, -p.gap * S);
    box(inner, oakMaterial(d.w, d.h), d.x, -p.gap - p.door_t, d.z, d.w, p.door_t, d.h);
    const cx = left ? d.x + p.cup_x : d.x + d.w - p.cup_x;
    for (const z of d.hingeZ) {
      const cup = new THREE.Mesh(new THREE.CylinderGeometry(p.cup_d / 2 * S, p.cup_d / 2 * S, 0.6 * S, 28), M.cup);
      cup.rotation.x = Math.PI / 2;
      cup.position.set(cx * S, z * S, (p.gap - 0.2) * S);
      inner.add(cup);
    }
    pivot.add(inner);
    pivot.rotation.y = state.open ? ((left ? -95 : 95) * Math.PI) / 180 : 0;
    group.add(pivot);
  }
  group.position.x = (-p.W / 2) * S;
  group.position.z = (-L.Dc / 2) * -S;
  scene.add(group);
  return L;
}

let framed = false;
function frame(W = state.W, H = state.H) {
  controls.target.set(0, (H / 2) * S, 0);
  if (!framed) {
    const size = Math.max(W, H) * S;
    const dist = size * 2.0 + 0.5;
    camera.position.set(-dist * 0.45, H * S * 0.75 + dist * 0.35, dist * 0.82);
    framed = true;
  }
  controls.update();
}

function resize() {
  const r = view.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(r.height, 1);
  camera.updateProjectionMatrix();
  if (typeof liftView === "function") liftView();
}
new ResizeObserver(resize).observe(view);

(function loop() {
  requestAnimationFrame(loop);
  controls.update();
  renderer.render(scene, camera);
})();

// ---------- controls ----------
function seg(title, key, options) {
  const g = document.createElement("div");
  g.className = "group";
  g.innerHTML = `<span class="label">${title}</span><div class="seg"></div>`;
  const boxEl = g.querySelector(".seg");
  options.forEach(([value, text]) => {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = text;
    b.setAttribute("aria-pressed", String(state[key] === value));
    b.addEventListener("click", () => { state[key] = value; update(); });
    boxEl.appendChild(b);
  });
  return g;
}
function slider(title, key, min, max, step) {
  const g = document.createElement("div");
  g.className = "group";
  g.innerHTML = `<span class="label">${title}<span>${state[key]} mm</span></span><input type="range" min="${min}" max="${max}" step="${step}" value="${state[key]}">`;
  const input = g.querySelector("input"), out = g.querySelector(".label span");
  input.addEventListener("input", () => { state[key] = +input.value; out.textContent = `${state[key]} mm`; update(false); });
  return g;
}

let shownDoors = -1;
function famName(f) { return T.names[f.family] || f.name; }
function productSeg() {
  const seen = [];
  for (const f of famIndex) if (!seen.find((x) => x.family === f.family)) seen.push(f);
  const g = seg(T.product, "product", [["base", T.base], ...seen.map((f) => [f.family, famName(f)])]);
  return g;
}
function controlsFor(L) {
  const c = document.getElementById("controls");
  c.innerHTML = "";
  if (famIndex.length) c.appendChild(productSeg());
  c.appendChild(slider(T.width, "W", 450, 1800, 10));
  c.appendChild(slider(T.height, "H", 600, 2000, 10));
  const lay = seg(T.layout, "layout", layoutOptions(L.n).map((o) => [o.key, T.layouts[o.key]]));
  lay.id = "layoutGroup";
  c.appendChild(lay);
  c.appendChild(seg(T.door, "open", [[false, T.doorState.closed], [true, T.doorState.open]]));
  shownDoors = L.n;
}

function famControls() {
  const c = document.getElementById("controls");
  c.innerHTML = "";
  c.appendChild(productSeg());
  const turns = famIndex.filter((f) => f.family === state.product);
  c.appendChild(seg(T.size, "turn", turns.map((f) => [f.turn, f.size[0] + " × " + f.size[1] + " × " + f.size[2]])));
  c.appendChild(seg(T.fronts, "fronts", [["show", T.frontState.show], ["hide", T.frontState.hide]]));
}
async function updateFamily() {
  const entry = famIndex.find((f) => f.family === state.product && f.turn === state.turn) ||
    famIndex.find((f) => f.family === state.product);
  state.turn = entry.turn;
  if (!famCache[entry.file]) famCache[entry.file] = await fetch("family/" + entry.file).then((r) => r.json());
  const item = famCache[entry.file];
  buildFamily(item);
  frame(item.box[3] - item.box[0], item.box[5] - item.box[2]);
  famControls();
  const esc = (x) => String(x).replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" })[ch]);
  document.getElementById("info").innerHTML = T.famInfo(item.counts) +
    `<span class="note"><br>${T.famNote}</span>` +
    `<br>${T.customer}: ` + item.customer.map((q) => `“${esc(q)}”`).join(" → ") +
    (item.notes.length ? `<details><summary>${T.notes}</summary><ul>${item.notes.map((n) => `<li>${esc(n)}</li>`).join("")}</ul></details>` : "") +
    (version.updated ? "<br>" + T.updated(version.updated, version.rev) + " · " : "<br>") + T.credit;
}

let lastProduct = state.product;
function update(redrawControls = true) {
  if (state.product !== lastProduct) { framed = false; lastProduct = state.product; }
  if (state.product !== "base") { updateFamily(); return; }
  const L = build();
  frame();
  if (redrawControls) controlsFor(L);
  else if (L.n !== shownDoors) {
    // door count changed while dragging: refresh only the door-arrangement buttons
    const old = document.getElementById("layoutGroup");
    const lay = seg(T.layout, "layout", layoutOptions(L.n).map((o) => [o.key, T.layouts[o.key]]));
    lay.id = "layoutGroup";
    old.replaceWith(lay);
    shownDoors = L.n;
  }
  document.getElementById("info").innerHTML = T.info(L) + `<span class="note"><br>${T.note}</span>` +
    (version.updated ? "<br>" + T.updated(version.updated, version.rev) + " · " : "<br>") + T.credit;
}

// small frame (e.g. an embed on the portfolio page): 3D fills it, options open over it
function setCompact() {
  const compact = window.innerHeight < 640;
  document.body.classList.toggle("compact", compact);
}
// in compact mode the options always sit over the bottom of the 3D; lift the cabinet above them
function liftView() {
  const ph = document.body.classList.contains("compact") ? document.getElementById("panel").getBoundingClientRect().height : 0;
  const r = view.getBoundingClientRect();
  if (ph) camera.setViewOffset(r.width, r.height, 0, ph / 2, r.width, r.height); else camera.clearViewOffset();
  // zoom out so the whole cabinet fits in the space left above the options
  camera.zoom = ph ? Math.max(0.4, (r.height - ph) / r.height) : 1;
  camera.updateProjectionMatrix();
}
new ResizeObserver(liftView).observe(document.getElementById("panel"));
window.addEventListener("resize", () => { setCompact(); liftView(); });
setCompact();

resize();
Promise.all([
  fetch("version.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : {})).catch(() => ({})),
  fetch("family/index.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : [])).catch(() => []),
]).then(([v, idx]) => { version = v || {}; famIndex = idx || []; update(); });
</script>
