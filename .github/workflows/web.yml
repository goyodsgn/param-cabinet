name: web-viewer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "cabinet_reference.py"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version shown under the viewer
        run: |
          echo "{\"updated\": \"$(TZ=Asia/Seoul date +%Y.%m.%d)\", \"rev\": \"$(git rev-parse --short HEAD)\"}" > web/version.json
          cat web/version.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
