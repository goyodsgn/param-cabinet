name: web-viewer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "cabinet_reference.py"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt trimesh pillow
      - name: Build the 3D models for every option
        run: python web/build_web.py
      - name: Keep the models in the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/models
          git diff --cached --quiet || (git commit -m "Web viewer models [skip ci]" && git pull --rebase && git push)
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
