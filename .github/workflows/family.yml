name: family-test

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Family ids (empty = all five)"
        default: ""
      model:
        description: "Model name"
        default: "claude-sonnet-5-5"
      max_turns:
        description: "Max agent steps per customer turn"
        default: "10"
      grade_only:
        description: "Only re-grade the saved models (no agent)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  family:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Re-grade saved models
        if: ${{ inputs.grade_only }}
        run: python experiment/run_family.py --grade-only --model ${{ inputs.model }}
      - uses: actions/setup-node@v4
        if: ${{ !inputs.grade_only }}
        with:
          node-version: "20"
      - name: Install Claude Code
        if: ${{ !inputs.grade_only }}
        run: npm install -g @anthropic-ai/claude-code
      - name: Build five product families with the agent (Pro subscription)
        if: ${{ !inputs.grade_only }}
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${{ inputs.only }}" ]; then rm -rf generated_family results/family; fi
          python experiment/run_family.py --only "${{ inputs.only }}" --model ${{ inputs.model }} --max-turns ${{ inputs.max_turns }}
      - name: Export the models for the web viewer
        run: python experiment/export_family_web.py
      - name: Make sure no token reached the files
        run: "! grep -rl 'sk-ant-' generated_family results web/family"
      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated_family results web/family
          git diff --cached --quiet || (git commit -m "Product family test results [skip ci]" && git pull --rebase && git push)
      - run: cat results/family.md >> "$GITHUB_STEP_SUMMARY"
