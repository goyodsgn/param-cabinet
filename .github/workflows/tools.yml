name: rule-checker-and-cutlist

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Korean font for the cut list drawings
        run: sudo apt-get install -y fonts-noto-cjk >/dev/null && rm -rf ~/.cache/matplotlib
      - name: Validate the rule checker, write cut lists
        run: python experiment/tools_validate.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git diff --cached --quiet || (git commit -m "Rule checker and cut list results [skip ci]" && git pull --rebase && git push)
      - run: cat results/rule_check.md >> "$GITHUB_STEP_SUMMARY"
