name: experiment

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many sentences (0 = all)"
        default: "0"
      model:
        description: "Model name"
        default: "claude-sonnet-5-5"
      set:
        description: "Sentence set: basic or priority"
        default: "basic"

permissions:
  contents: write

jobs:
  step3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pick the sentence set
        run: |
          if [ "${{ inputs.set }}" = "priority" ]; then
            echo "SENT=experiment/sentences_priority.csv" >> $GITHUB_ENV
            echo "GEN=generated_priority" >> $GITHUB_ENV
            echo "OUT=results/step3_priority" >> $GITHUB_ENV
          else
            echo "SENT=experiment/sentences.csv" >> $GITHUB_ENV
            echo "GEN=generated" >> $GITHUB_ENV
            echo "OUT=results/step3" >> $GITHUB_ENV
          fi
      - name: Generate models with the LLM
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: rm -rf $GEN && python experiment/generate.py --limit ${{ inputs.limit }} --model ${{ inputs.model }} --sentences $SENT --out-dir $GEN
      - name: Run and check every generated model
        run: python experiment/run_generated.py --dir $GEN --out $OUT --sentences $SENT
      - name: Save generated code and results to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $GEN results
          git diff --cached --quiet || (git commit -m "Step 3 results [skip ci]" && git pull --rebase && git push)
      - run: cat $OUT.md >> "$GITHUB_STEP_SUMMARY"
