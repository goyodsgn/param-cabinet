name: experiment

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many sentences (0 = all)"
        default: "0"
      model:
        description: "Model name"
        default: "claude-sonnet-5-5"

permissions:
  contents: write

jobs:
  step3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate models with the LLM
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python experiment/generate.py --limit ${{ inputs.limit }} --model ${{ inputs.model }}
      - name: Run and check every generated model
        run: python experiment/run_generated.py --dir generated --out results/step3
      - name: Save generated code and results to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated results
          git diff --cached --quiet || (git commit -m "Step 3 results [skip ci]" && git pull --rebase && git push)
      - run: cat results/step3.md >> "$GITHUB_STEP_SUMMARY"
