name: conversation-test

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Conversation ids, comma separated (empty = all)"
        default: ""
      model:
        description: "Model name"
        default: "claude-sonnet-5-5"

permissions:
  contents: write

jobs:
  chat:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Talk to the LLM (two turns per customer)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: rm -rf generated_chat && python experiment/generate_chat.py --model ${{ inputs.model }} --only "${{ inputs.only }}"
      - name: Check every turn against the request
        run: python experiment/run_chat.py --dir generated_chat --out results/chat --previews
      - name: Save conversations and results to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated_chat results
          git diff --cached --quiet || (git commit -m "Conversation test results [skip ci]" && git pull --rebase && git push)
      - run: cat results/chat.md >> "$GITHUB_STEP_SUMMARY"
